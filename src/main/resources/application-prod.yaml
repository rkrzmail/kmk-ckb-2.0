#ENV
env: prod

management:
  endpoints:
    web:
      exposure:
        # Security issue #8: prod hanya info & health (logfile juga memicu
        # unduhan log via /api/monitoring/logfile yang di-whitelist)
        include: info, health
      base-path: /api/monitoring
  endpoint:
    health:
      show-components: always
      show-details: never
    logfile:
      external-file: admin.log
spring:
  flyway:
    enabled: 'true'
    schemas: public
    locations: classpath:db/migration/prod/{vendor}
    baseline-on-migrate: 'true'
    out-of-order: true
  data:
    redis:
      database: '6'
      lettuce:
        pool:
          max-active: '30'
          enabled: 'true'
          min-idle: '2'
          max-wait: '10000'
          max-idle: '10'
      port: '6379'
      password: ''
      host: localhost
    mongodb:
      port: '27017'
      host: localhost
      database: kmklog
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: 'false'
  servlet:
    multipart:
      enabled: 'true'
      max-request-size: 100MB
      max-file-size: 100MB
  cache:
    type: redis
  application:
    name: kmkbe
  boot:
    admin:
      client:
        url: http://localhost:9000
        username: vandikalvandi@gmail.com
        instance:
          name: Kmk-Digital-2.0
        password: ${BOOT_ADMIN_PASSWORD:}
  datasource:
    # Security issue #2: kredensial via env var - WAJIB diset saat deploy prod
    password: ${SPRING_DATASOURCE_PASSWORD:}
    url: jdbc:postgresql://aurora-kmkprod.cluster-cc6z1g8cfqcv.ap-southeast-3.rds.amazonaws.com:5432/kmkds?stringtype=unspecified
    username: postgres
  jackson:
    deserialization:
      adjust-dates-to-context-time-zone: 'true'
  mvc:
    static-path-pattern: /static/**
logging:
  level:
    org:
      hibernate:
        orm:
          jdbc:
            bind: info
        stat: info
        type: info
  file:
    name: ./logs/log-file.log
springdoc:
  api-docs:
    path: /api/v1/api-docs
    enabled: 'false'
  paths-to-match: /api/v1/**
  swagger-ui:
    path: /api/v1/swagger-ui.html
    enabled: 'false'
rsa:
  public-key: classpath:certs/public-key.pem
  private-key: classpath:certs/pkcs8.pem
testing:
  mail:
    password: ${TESTING_MAIL_PASSWORD:}
    port: '587'
    host: smtp.gmail.com
    username: khesa.oto@gmail.com
csul:
  confins:
    ap:
      v1: https://confinsr3.csulfinance.com/api/ap/v1
    fou:
      v1: https://confinsr3.csulfinance.com/api/fou/v1
    payment:
      v1: https://confinsr3.csulfinance.com/api/payment/v1
    adinskey: ${CONFINS_ADINS_KEY:}
    mou:
      v1: https://confinsr3.csulfinance.com/api/mou/v1
    ar:
      v1: https://confinsr3.csulfinance.com/api/ar/v1
    los:
      v1: https://confinsr3.csulfinance.com/api/los/v1
  sisca:
    v1:
      auth:
        username: KMKDigital
        password: ${SISCA_PASSWORD:}
      white-list: http://10.30.15.160:8185/SISCAConnect/api/v1
      internal: http://10.30.15.160:8185/SISCAConnect/api/v1
    mail-position:
      branch-admin: "ADM"
      account-officer: "AO/AM"
      branch-manager: "BM/BOH"
      area-sales-manager: "RM"
  mst:
    v1: https://16.78.161.115/v1
security:
  api:
    key: ${SECURITY_API_KEY:}
  jwt:
    secret-key: ${SECURITY_JWT_SECRET_KEY:}
    expiration-time: '3000000'
  secret-key: ${SECURITY_SECRET_KEY:}
jwt:
  refreshExpirationDateInMs: '9000000'
server:
  error:
    whitelabel:
      enabled: 'false'
  port: '8443'

aspect:
  enabled: 'true'

# Keep your custom collection property anywhere you like
custom:
  mongodb:
    collection: event

feign:
  csul:
    ckb:
      url: https://api-ckbvendorportal.dipstrategy.co.id
      api-key:

  confins:
    url: https://uat-confinsr3.csulfinance.com
    adins-key: ${CONFINS_ADINS_KEY:}
    secret:
    api-key:
    fou: "${feign.confins.url}/api/fou"
    ap: "${feign.confins.url}/api/ap"